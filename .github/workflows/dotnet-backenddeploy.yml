name: Build and Deploy to Azure Web App
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Restore dependencies
      run: dotnet restore BPIndustrialPortal/BPIndustrialPortal.sln
    - name: Build
      run: dotnet build BPIndustrialPortal/BPIndustrialPortal.sln --configuration Release --no-restore
    # - name: Test
    #   run: dotnet test BPIndustrialPortal/BP.Tests/BP.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results
    # - name: Upload test results
    #   if: always()
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: test-results
    #     path: ./test-results/test-results.trx
    - name: Publish
      run: dotnet publish BPIndustrialPortal/BP/BP.csproj --configuration Release --output ./publish
    - name: Deploy to Azure Web App (with publish profile)
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
